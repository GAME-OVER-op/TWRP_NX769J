name: Build NX769J Recovery

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "Manifest URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_lineageos.git"
      manifest_branch:
        description: "Manifest branch"
        required: true
        default: "twrp-14.1"
      device_path:
        description: "Device tree install path in source tree"
        required: true
        default: "device/nubia/NX769J"
      lunch_target:
        description: "Lunch target"
        required: true
        default: "twrp_NX769J-eng"
      build_target:
        description: "Make target"
        required: true
        default: "recoveryimage"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-recovery.yml"
      - "device/nubia/NX769J/**"
      - "scripts/**"
      - "README.md"
      - "SETUP_RU.txt"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-recovery.yml"
      - "device/nubia/NX769J/**"
      - "scripts/**"
      - "README.md"
      - "SETUP_RU.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          df -h
          free -h || true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            adb aria2 bash bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick jq lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev \
            libncurses5 libtinfo5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush python-is-python3 python3 repo rsync \
            schedtool squashfs-tools unzip xsltproc zip zlib1g-dev

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Ensure legacy ncurses compatibility
        run: |
          set -e
          ncurses_src="$(ldconfig -p | awk '/libncurses\.so\.6 /{print $NF; exit}')"
          tinfo_src="$(ldconfig -p | awk '/libtinfo\.so\.6 /{print $NF; exit}')"
          [ -n "$ncurses_src" ] || ncurses_src=/lib/x86_64-linux-gnu/libncurses.so.6
          [ -n "$tinfo_src" ] || tinfo_src=/lib/x86_64-linux-gnu/libtinfo.so.6
          test -e "$ncurses_src"
          test -e "$tinfo_src"
          sudo mkdir -p /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
          sudo ln -sf "$ncurses_src" /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf "$ncurses_src" /lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf "$tinfo_src" /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf "$tinfo_src" /lib/x86_64-linux-gnu/libtinfo.so.5
          ls -l /usr/lib/x86_64-linux-gnu/libncurses.so.5 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          ls -l /lib/x86_64-linux-gnu/libncurses.so.5 /lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install

      - name: Initialize source tree
        run: |
          mkdir -p "$HOME/android"
          cd "$HOME/android"
          repo init -u "${{ github.event.inputs.manifest_url || 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_lineageos.git' }}" \
            -b "${{ github.event.inputs.manifest_branch || 'twrp-14.1' }}" \
            --depth=1

      - name: Sync source tree
        run: |
          cd "$HOME/android"
          repo sync -c --no-clone-bundle --no-tags -j4

      - name: Install device tree
        run: |
          cd "$HOME/android"
          DEVICE_PATH="${{ github.event.inputs.device_path || 'device/nubia/NX769J' }}"
          mkdir -p "$(dirname "$DEVICE_PATH")"
          rm -rf "$DEVICE_PATH"
          cp -a "$GITHUB_WORKSPACE/device/nubia/NX769J" "$DEVICE_PATH"
          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/twrp_NX769J.mk"

      - name: Fetch missing legacy sources
        run: |
          cd "$HOME/android"
          if [ ! -d external/libtar ]; then
            git clone --depth=1 -b lineage-16.0 https://github.com/LineageOS/android_external_libtar external/libtar
          fi

      - name: Patch legacy recovery sources
        shell: bash
        run: |
          set -e
          cd "$HOME/android"
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("bootable/recovery/Android.mk")
          if p.exists():
              s = p.read_text()
              patterns = [
                  r"^.*libminivold_static.*\n?",
                  r"^.*libfsck_msdos.*\n?",
                  r"^.*libminipigz_static.*\n?",
                  r"^.*libzopfli.*\n?",
                  r"^.*system/vold/[^\s]*\.cpp.*\n?",
              ]
              for pat in patterns:
                  s = re.sub(pat, "", s, flags=re.MULTILINE)
              p.write_text(s)
          PY
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("bootable/recovery/recovery_cmds.h")
          if p.exists():
              s = p.read_text()
              repls = {
                  "int vold_main(int argc, char **argv);": "static inline int vold_main(int argc, char **argv) { (void)argc; (void)argv; return 0; }",
                  "int fsck_msdos_main(int argc, char **argv);": "static inline int fsck_msdos_main(int argc, char **argv) { (void)argc; (void)argv; return 0; }",
                  "int newfs_msdos_main(int argc, char **argv);": "static inline int newfs_msdos_main(int argc, char **argv) { (void)argc; (void)argv; return 0; }",
                  "int pigz_main(int argc, char **argv);": "static inline int pigz_main(int argc, char **argv) { (void)argc; (void)argv; return 0; }",
                  "int vdc_main(int argc, char **argv);": "static inline int vdc_main(int argc, char **argv) { (void)argc; (void)argv; return 0; }",
              }
              for old, new in repls.items():
                  s = s.replace(old, new)
              for pat in [
                  r"^\s*\{\s*\"minivold\".*\n?",
                  r"^\s*\{\s*\"fsck_msdos\".*\n?",
                  r"^\s*\{\s*\"newfs_msdos\".*\n?",
                  r"^\s*\{\s*\"pigz\".*\n?",
                  r"^\s*\{\s*\"gzip\".*\n?",
                  r"^\s*\{\s*\"gunzip\".*\n?",
                  r"^\s*\{\s*\"vdc\".*\n?",
              ]:
                  s = re.sub(pat, "", s, flags=re.MULTILINE)
              p.write_text(s)
          PY
          mkdir -p bootable/recovery
          cat > bootable/recovery/cryptfs.h <<'EOF'
          #pragma once
          /* Compatibility shim for legacy recovery sources used by old TWRP bu_recovery. */
          #ifndef CRYPT_FOOTER_OFFSET
          #define CRYPT_FOOTER_OFFSET 0x4000
          #endif
          EOF
          if [ ! -f bootable/recovery/VolumeBase.h ]; then
            cat > bootable/recovery/VolumeBase.h <<'EOF'
          #pragma once

          namespace android {
          namespace vold {

          class VolumeBase {
           public:
            enum class State {
              kUnmounted = 0,
              kChecking = 1,
              kMounted = 2,
              kMountedReadOnly = 3,
              kFormatting = 4,
              kEjecting = 5,
              kUnmountable = 6,
              kRemoved = 7,
              kBadRemoval = 8,
            };
          };

          }  // namespace vold
          }  // namespace android
          EOF
          fi
          if [ ! -f bootable/recovery/ResponseCode.h ]; then
            cat > bootable/recovery/ResponseCode.h <<'EOF'
          #pragma once

          class ResponseCode {
           public:
            static const int CommandOkay = 200;
            static const int VolumeCreated = 650;
            static const int VolumeStateChanged = 651;
            static const int VolumeFsLabelChanged = 654;
            static const int VolumePathChanged = 655;
            static const int VolumeInternalPathChanged = 656;
            static const int VolumeDestroyed = 659;
          };
          EOF
          fi
          echo "Legacy compatibility headers:"
          ls -l bootable/recovery/cryptfs.h bootable/recovery/VolumeBase.h bootable/recovery/ResponseCode.h || true
          grep -nE 'libminivold_static|libfsck_msdos|libminipigz_static|libzopfli|system/vold/' bootable/recovery/Android.mk || true
          grep -nE 'vold_main|fsck_msdos_main|newfs_msdos_main|pigz_main|vdc_main|minivold|fsck_msdos|newfs_msdos|pigz|gzip|gunzip|vdc' bootable/recovery/recovery_cmds.h || true

          # TWRP 14.1 legacy policy compatibility: some old policy rules reference exfat,
          # but the minimal manifest may not declare the type. Declare it before checkpolicy runs.
          if [ -f system/sepolicy/file.te ] && ! grep -qE '^type[[:space:]]+exfat[,:]' system/sepolicy/file.te; then
            cat >> system/sepolicy/file.te <<'EOF'

          # Compatibility shim for legacy TWRP policy rules.
          type exfat, fs_type;
          EOF
          fi
          grep -nE '^type[[:space:]]+exfat[,:]' system/sepolicy/file.te || true

      - name: Start build
        shell: bash
        run: |
          set -eo pipefail
          cd "$HOME/android"
          export JAVA_HOME="${JAVA_HOME_8_X64:-${JAVA_HOME}}"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          test -f "$JAVA_HOME/lib/tools.jar"
          java -version
          javac -version
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          LUNCH_TARGET="${{ github.event.inputs.lunch_target || 'twrp_NX769J-eng' }}"
          BUILD_TARGET="${{ github.event.inputs.build_target || 'recoveryimage' }}"
          {
            echo "=== lunch ${LUNCH_TARGET} ==="
            lunch "${LUNCH_TARGET}"
            echo "=== mka ${BUILD_TARGET} ==="
            mka "${BUILD_TARGET}" -j"$(nproc 2>/dev/null || echo 4)"
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out_artifacts"
          if [ -d "$HOME/android" ]; then
            cd "$HOME/android"
            find out/target/product -type f \( -name 'recovery.img' -o -name '*.zip' -o -name 'vendor_boot*.img' -o -name 'boot*.img' \) -exec cp -v {} "$GITHUB_WORKSPACE/out_artifacts/" \; || true
          fi
          cp -v "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/out_artifacts/" || true
          ls -lah "$GITHUB_WORKSPACE/out_artifacts" || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx769j-recovery-${{ github.run_number }}
          path: |
            out_artifacts/*
          if-no-files-found: warn
          retention-days: 14
